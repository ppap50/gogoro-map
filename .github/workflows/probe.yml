name: probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          curl -sS -m 60 -A "$UA" -H "Origin: https://www.gogoro.com" -D h.txt "https://official-site-pro.gogoroapp.com/PartnerService/Gogoro/GetVmList?offset=0&pageSize=10000" -o d.json
          cat h.txt > out.txt
          python3 -c "import json;d=json.load(open('d.json'));print(type(d), list(d)[:10] if isinstance(d,dict) else '');a=d['Data'];print(len(a));print(json.dumps(a[:2],ensure_ascii=False)[:3000])" >> out.txt 2>&1
          cp out.txt $GITHUB_WORKSPACE/probe-out.txt
          cd $GITHUB_WORKSPACE && git config user.name bot && git config user.email bot@users.noreply.github.com && git add probe-out.txt && git commit -m "probe output" && git push
