name: probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          mkdir -p /tmp/p && cd /tmp/p
          curl -sS -L -m 60 -A "$UA" https://cdn.gogoro.com/libs/ggr-find-us/latest/ggr-find-us.min.js -o f.js
          for k in official-site-pro gogoroapp.com data/findus apiDomain /vm "swap-station" "station/list" "/stations" getStation; do
            echo "##### $k" >> out.txt
            grep -oE ".{0,250}$k.{0,250}" f.js | head -6 >> out.txt
          done
          cp out.txt $GITHUB_WORKSPACE/probe-out.txt
          cd $GITHUB_WORKSPACE && git config user.name bot && git config user.email bot@users.noreply.github.com && git add probe-out.txt && git commit -m "probe output" && git push
