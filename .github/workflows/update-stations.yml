name: 更新站點資料

on:
  push:
    branches: [main]
    paths: [".github/workflows/update-stations.yml", "scripts/update_stations.py"]
  schedule:
    - cron: "0 19 * * *"  # 每天台灣時間 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_stations.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git diff --cached --quiet || git commit -m "更新站點資料" && git push
